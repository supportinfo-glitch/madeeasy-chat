# Publishes the React Native package when a tag like react-native-v0.2.0 is pushed.
# npm trusts this workflow directly (trusted publishing, set on the package's npm
# settings page), so no token is stored anywhere and each version carries signed
# provenance. The first version was published by hand, as npm requires.
name: Publish to npm
on:
  push:
    tags: ["react-native-v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
